[tool.poetry]
name = "healthcare-dw"
version = "0.1.0"
description = "Healthcare data warehouse — ingestion, transformation, and quality pipelines"
authors = ["Shivani Rao <dhyanagni19@gmail.com>"]
readme = "README.md"
packages = [{ include = "ingestion" }, { include = "scripts" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.2"
pyarrow = "^16.0"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
boto3 = "^1.34"
requests = "^2.31"
python-dotenv = "^1.0"
dbt-core = "^1.8"
dbt-postgres = "^1.8"
great-expectations = "^0.18"
apache-airflow = { version = "^2.9", extras = ["postgres"] }
pydantic = "^2.7"
loguru = "^0.7"
snowflake-connector-python = {version = "^3.10", extras = ["pandas"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"
pre-commit = "^3.7"
ipykernel = "^6.29"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ingestion --cov=scripts --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
